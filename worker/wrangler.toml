# Cloudflare Worker für die Lernapp-KI. Anleitung: worker/README.md
name = "lernapp-ki"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Webseiten, die den Worker benutzen dürfen (kommagetrennt, ohne Schrägstrich am Ende).
ALLOWED_ORIGINS = "https://markuscampidell.github.io,http://localhost:5173,http://localhost:4173"
# Gemini-Modell. "gemini-flash-latest" zeigt immer auf das aktuelle Flash-Modell.
MODEL = "gemini-flash-latest"

# Höchstens 15 Anfragen pro Minute und IP-Adresse.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 15
  period = 60

# Der Schlüssel steht NICHT hier, sondern wird als Secret gespeichert:
#   npx wrangler secret put GEMINI_API_KEY
